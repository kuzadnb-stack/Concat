[effect]
id = "concat.compressor"
name = "Compressor"
kind = "audio"
category = "Dynamics"
order = 10
description = "Tames loud peaks and brings a guitar take forward."

[[param]]
key = "threshold_db"
label = "Threshold"
min = -36
max = 0
default = -12
step = 1
unit = "dB"

[[param]]
key = "ratio"
label = "Ratio"
min = 1
max = 12
default = 3
step = 0.5

[[param]]
key = "attack"
label = "Attack"
min = 1
max = 100
default = 12
step = 1
unit = "ms"

[[param]]
key = "release"
label = "Release"
min = 20
max = 800
default = 160
step = 10
unit = "ms"

[[param]]
key = "makeup"
label = "Makeup"
min = 0
max = 12
default = 2
step = 0.5
unit = "dB"

[ffmpeg]
chain = "acompressor=threshold={fixed(pow(10, threshold_db / 20), 4)}:ratio={fixed(ratio, 1)}:attack={fixed(attack, 1)}:release={fixed(release, 1)}:makeup={fixed(makeup, 1)},alimiter=limit=0.95"