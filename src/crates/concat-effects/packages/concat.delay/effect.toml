[effect]
id = "concat.delay"
name = "Delay"
kind = "audio"
category = "Space"
order = 28
intensity = "mix"
aliases = ["delay"]
description = "A tempo-friendly repeat with independent time, feedback and wet controls."

[[param]]
key = "time"
label = "Time"
min = 0.05
max = 1.5
default = 0.25
step = 0.01
unit = "s"

[[param]]
key = "feedback"
label = "Feedback"
min = 5
max = 90
default = 35
step = 1
unit = "%"

[[param]]
key = "mix"
label = "Wet"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[ffmpeg]
chain = "aecho={fixed(1 - mix / 100, 2)}:{fixed(mix / 100, 2)}:{round(time * 1000)}:{fixed(feedback / 100, 2)}"